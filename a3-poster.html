<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; frame-src 'none'"><title>A3 滿版拼接列印｜瑋佳工具箱</title><link rel="stylesheet" href="a3-poster.css"></head><body><main class="wrap"><a href="./">← 返回瑋佳 PDF 工具箱</a><h1>A3 滿版拼接列印</h1><p>將一張 JPG／PNG／WebP 圖片分成真正 A3 尺寸的 PDF：2 張拼 A2、4 張拼接近 A1。</p><section><label for="file">1. 選擇圖片</label><input type="file" id="file" accept="image/jpeg,image/png,image/webp"><div class="grid"><label>2. 拼接方式<select id="mode"><option value="2">2 張 A3 → A2</option><option value="4">4 張 A3 → A1（相差 1 mm）</option></select></label><label>3. 最終方向<select id="layout"><option value="landscape">橫式</option><option value="portrait">直式</option></select></label><label>4. 圖像填滿<select id="fit"><option value="cover">等比例鋪滿（可能裁切）</option><option value="contain">完整保留（可能留白）</option></select></label><label>5. 清晰度<select id="dpi"><option value="150">150 DPI</option><option value="200">200 DPI</option><option value="300">300 DPI（高記憶體需求）</option></select></label></div><div class="actions"><button id="make">產生 A3 PDF</button><button id="save" disabled>下載 PDF</button></div><p id="status" role="status">請選擇圖片。</p></section><section><h2>分割預覽</h2><canvas id="preview" width="700" height="450"></canvas><p id="size"></p><p class="note"><strong>列印提醒：</strong>以 PDF 閱讀器開啟，設定「A3 紙張、實際大小 100%」，不要使用「符合頁面」。印表機須支援 A3；要完全無白邊，還須支援 A3 無邊界列印，否則需裁邊或交由輸出店處理。圖片全程在瀏覽器處理，不上傳。</p></section></main><script src="a3-poster.js" defer></script></body></html>
